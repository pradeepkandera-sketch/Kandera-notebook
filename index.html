<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kandera Notebook</title>
<style>
:root{--navy:#14233b;--blue:#2457a7;--line:#d8deea;--bg:#eef2f8;--text:#182235}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Segoe UI",Arial,sans-serif}
.app{max-width:1200px;margin:8px auto;padding:0 6px}.window{background:#fff;border:1px solid #cdd5e2;border-radius:12px;overflow:hidden;box-shadow:0 12px 36px #13213b18}
.header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(120deg,#14233b,#2457a7);color:#fff}
.logo{height:40px;width:40px;border:1px solid #ffffff80;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:18px}
.brand{font-size:21px;font-weight:750;letter-spacing:.3px}.subtitle{font-size:12px;color:#d9e5ff}.status{margin-left:auto;font-size:11px;color:#e4edff;text-align:right}
.menubar{display:flex;gap:2px;flex-wrap:wrap;padding:6px;background:#f8faff;border-bottom:1px solid var(--line)}
.menu{position:relative}.menu>button,.toolbtn{border:1px solid transparent;background:transparent;border-radius:6px;padding:7px 9px;color:#1d2b42;cursor:pointer;font:inherit}
.menu>button:hover,.toolbtn:hover{background:#e7edf8;border-color:#cbd6e8}.dropdown{display:none;position:absolute;z-index:10;top:100%;left:0;min-width:175px;padding:5px;background:white;border:1px solid #cbd4e2;border-radius:8px;box-shadow:0 8px 22px #14233b24}
.menu.open .dropdown{display:block}.dropdown button{width:100%;text-align:left;border:0;background:#fff;padding:9px 10px;border-radius:5px;cursor:pointer;font:inherit;color:var(--text)}.dropdown button:hover{background:#edf3ff}.dropdown hr{border:0;border-top:1px solid #e4e8ef;margin:4px}.shortcut{float:right;color:#7b8799;font-size:11px;margin-left:12px}
.toolbar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:8px;border-bottom:1px solid var(--line);background:#fff}.toolbtn{min-width:34px;padding:6px 8px;border:1px solid #dce2ec;background:#fff;font-weight:600}
.toolbtn.active{background:#dfeaff;border-color:#7da2e3;color:#174a9b}select,input[type=color]{height:34px;border:1px solid #d5dce8;border-radius:6px;background:white;padding:4px 7px;color:var(--text)}select{max-width:150px}.sep{height:24px;border-left:1px solid #dce2ec;margin:0 2px}
.editor-wrap{padding:10px;background:#f4f6fa}#editor{min-height:58vh;padding:20px 18px;background:#fff;border:1px solid #d6dce7;border-radius:7px;outline:none;overflow-wrap:anywhere;font:16px/1.7 Arial,sans-serif;color:#111}
#editor:focus{border-color:#8caee8;box-shadow:0 0 0 3px #2457a715}#editor:empty:before{content:"यहाँ अपना नोट लिखें…";color:#a0a8b6;pointer-events:none}
.footer{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 12px;border-top:1px solid var(--line);font-size:12px;color:#5c687a;background:#fbfcff}#filename{font-weight:600;color:#34445d}#saveState{margin-left:auto}.hidden{display:none!important}
@media(max-width:420px){.status{display:none}.brand{font-size:19px}.toolbar{gap:3px}.menu>button{padding:7px}.editor-wrap{padding:6px}#editor{padding:14px 12px;min-height:62vh}}
@media print{body,.app{margin:0;padding:0;background:white}.window{border:0;box-shadow:none}.header,.menubar,.toolbar,.footer{display:none!important}.editor-wrap{padding:0;background:white}#editor{border:0;box-shadow:none;min-height:0;padding:0;color:#000;overflow:visible}@page{margin:18mm}}
</style></head>
<body><div class="app"><div class="window">
<header class="header"><div class="logo">KN</div><div><div class="brand">Kandera Notebook</div><div class="subtitle">आपकी निजी नोटबुक · Your notes, your device</div></div><div class="status">WRITE · SAVE · PRINT</div></header>
<nav class="menubar">
<div class="menu"><button type="button">File ▾</button><div class="dropdown"><button data-action="new">New <span class="shortcut">Ctrl+N</span></button><button data-action="open">Open… <span class="shortcut">Ctrl+O</span></button><button data-action="save">Save <span class="shortcut">Ctrl+S</span></button><button data-action="saveas">Save As…</button><hr><button data-action="print">Print… <span class="shortcut">Ctrl+P</span></button></div></div>
<div class="menu"><button type="button">Edit ▾</button><div class="dropdown"><button data-action="undo">Undo <span class="shortcut">Ctrl+Z</span></button><button data-action="redo">Redo <span class="shortcut">Ctrl+Y</span></button><hr><button data-action="cut">Cut</button><button data-action="copy">Copy</button><button data-action="paste">Paste</button><button data-action="selectall">Select All <span class="shortcut">Ctrl+A</span></button></div></div>
<div class="menu"><button type="button">Font ▾</button><div class="dropdown"><button data-action="bold"><b>Bold</b></button><button data-action="italic"><i>Italic</i></button><button data-action="underline"><u>Underline</u></button><button data-action="selectall">Select All</button></div></div>
<div class="menu"><button type="button">Help ▾</button><div class="dropdown"><button data-action="about">About Kandera Notebook</button><button data-action="shortcuts">Keyboard shortcuts</button></div></div></nav>
<div class="toolbar"><button class="toolbtn" data-action="bold" title="Bold"><b>B</b></button><button class="toolbtn" data-action="italic" title="Italic"><i>I</i></button><button class="toolbtn" data-action="underline" title="Underline"><u>U</u></button><span class="sep"></span>
<select id="fontFamily" title="Font family"><option value="Arial">Arial</option><option value="Calibri">Calibri</option><option value="Georgia">Georgia</option><option value="Times New Roman">Times New Roman</option><option value="Verdana">Verdana</option><option value="Courier New">Courier New</option></select>
<select id="fontSize" title="Font size"><option value="2">10 pt</option><option value="3" selected>12 pt</option><option value="4">14 pt</option><option value="5">18 pt</option><option value="6">24 pt</option><option value="7">36 pt</option></select><input id="fontColor" type="color" value="#111111" title="Font color"><span class="sep"></span><button class="toolbtn" data-action="selectall">Select All</button><button class="toolbtn" data-action="print">🖨 Print</button></div>
<main class="editor-wrap"><div id="editor" contenteditable="true" spellcheck="true" role="textbox" aria-label="Notebook editor" aria-multiline="true"></div></main>
<footer class="footer"><span>File: <span id="filename">Untitled.txt</span></span><span id="wordCount">0 words · 0 characters</span><span id="saveState">Ready</span></footer></div>
<input id="openFile" class="hidden" type="file" accept=".txt,.html,.htm,.md,.rtf,.csv,.json,text/plain,text/html,text/markdown"></div>
<script>
(()=>{const editor=document.getElementById('editor'),openFile=document.getElementById('openFile'),filenameEl=document.getElementById('filename'),saveState=document.getElementById('saveState'),wordCount=document.getElementById('wordCount');let currentName='Untitled.txt',dirty=false;
const menus=[...document.querySelectorAll('.menu')];function closeMenus(){menus.forEach(m=>{m.classList.remove('open');m.querySelector(':scope > button').setAttribute('aria-expanded','false')})}
menus.forEach(m=>m.querySelector(':scope > button').addEventListener('click',e=>{e.stopPropagation();const was=m.classList.contains('open');closeMenus();if(!was){m.classList.add('open');m.querySelector(':scope > button').setAttribute('aria-expanded','true')}}));document.addEventListener('click',closeMenus);document.querySelectorAll('.dropdown').forEach(d=>d.addEventListener('click',e=>e.stopPropagation()));
function update(){const t=editor.innerText||'',words=t.trim()?t.trim().split(/\s+/).length:0;wordCount.textContent=`${words} words · ${t.length} characters`;filenameEl.textContent=currentName;saveState.textContent=dirty?'Unsaved changes':'Ready'}editor.addEventListener('input',()=>{dirty=true;update()});
function command(cmd,value=null){editor.focus();try{document.execCommand(cmd,false,value)}catch(e){}dirty=true;update()}function textContent(){return editor.innerText.replace(/\r\n/g,'\n')}
function newDoc(){if(dirty&&!confirm('Unsaved changes. Create a new note anyway?'))return;editor.innerHTML='';currentName='Untitled.txt';dirty=false;update()}
function saveAs(){if(window.AndroidNotebook){const n=currentName==='Untitled.txt'?'Kandera-Note.txt':currentName;window.AndroidNotebook.saveText(n,(n.endsWith('.html')||n.endsWith('.htm'))?editor.innerHTML:textContent());return}
 if(window.showSaveFilePicker){window.showSaveFilePicker({suggestedName:currentName,types:[{description:'Text file',accept:{'text/plain':['.txt']}},{description:'HTML document',accept:{'text/html':['.html']}}]}).then(async h=>{let ext=(h.name.split('.').pop()||'txt').toLowerCase(),data=['html','htm'].includes(ext)?editor.innerHTML:textContent(),w=await h.createWritable();await w.write(data);await w.close();currentName=h.name;dirty=false;update()}).catch(()=>{});return}
 const name=prompt('फ़ाइल का नाम लिखें:',currentName==='Untitled.txt'?'Kandera-Note.txt':currentName);if(!name)return;const blob=new Blob([textContent()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name.includes('.')?name:name+'.txt';a.click();URL.revokeObjectURL(url);currentName=a.download;dirty=false;update()}
function save(){saveAs()}function open(){if(window.AndroidNotebook){window.AndroidNotebook.openFile();return}if(dirty&&!confirm('Unsaved changes. Open another file anyway?'))return;openFile.click()}
openFile.addEventListener('change',async()=>{const f=openFile.files[0];if(!f)return;const t=await f.text(),ext=(f.name.split('.').pop()||'').toLowerCase();if(['html','htm'].includes(ext)){const d=new DOMParser().parseFromString(t,'text/html');editor.innerHTML=d.body.innerHTML}else editor.textContent=t;currentName=f.name;dirty=false;update();openFile.value=''});
window.onNativeFileOpened=(content,name)=>{try{currentName=name||'Opened.txt';if(currentName.toLowerCase().endsWith('.html')||currentName.toLowerCase().endsWith('.htm'))editor.innerHTML=content;else editor.textContent=content;dirty=false;update();saveState.textContent='File opened'}catch(e){alert('Could not open file')}};
async function paste(){editor.focus();try{const t=await navigator.clipboard.readText();document.execCommand('insertText',false,t)}catch(e){alert('Paste के लिए टेक्स्ट पर देर तक दबाएँ और Paste चुनें, या Ctrl+V इस्तेमाल करें।')}dirty=true;update()}
const actions={new:newDoc,open,save,saveas,print:()=>window.AndroidNotebook?window.AndroidNotebook.printPage():window.print(),undo:()=>command('undo'),redo:()=>command('redo'),cut:()=>command('cut'),copy:()=>command('copy'),paste,selectall:()=>command('selectAll'),bold:()=>command('bold'),italic:()=>command('italic'),underline:()=>command('underline'),about:()=>alert('Kandera Notebook — Android edition'),shortcuts:()=>alert('Keyboard shortcuts: Ctrl+N New, Ctrl+O Open, Ctrl+S Save, Ctrl+P Print, Ctrl+B Bold, Ctrl+I Italic, Ctrl+U Underline, Ctrl+A Select All')};
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.action;closeMenus();if(actions[a])actions[a]()}));
document.getElementById('fontFamily').addEventListener('change',e=>command('fontName',e.target.value));document.getElementById('fontSize').addEventListener('change',e=>command('fontSize',e.target.value));document.getElementById('fontColor').addEventListener('input',e=>command('foreColor',e.target.value));
document.addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey))return;const m={n:'new',o:'open',s:'save',p:'print',b:'bold',i:'italic',u:'underline',a:'selectall',z:'undo',y:'redo'},a=m[e.key.toLowerCase()];if(a){e.preventDefault();actions[a]()}});
update()})();
</script></body></html>
